services:
  api:
    build: .
    container_name: cohort_api
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: cohort_insights
      REDIS_URL: redis://redis:6379/0
      WORKER_POLL_SECONDS: 1
      CACHE_TTL_SECONDS: 86400
      ACTIVE_JOB_TTL_SECONDS: 3600
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:8
    container_name: cohort_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: cohort_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
